name: MOBILE-FORWARD-01 isolated contract
on:
  pull_request:
    paths:
      - 'references/mobile-forward-01-policy.mjs'
      - 'tests/mobile-forward-01-policy.test.mjs'
      - '.github/workflows/mobile-forward-01-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mobile-forward-01-policy.test.mjs
