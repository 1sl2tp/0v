name: API application check
on:
  pull_request:
    branches: [main]
  push:
    branches: ['review/**']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/callback-01-policy.test.mjs
      - run: node audit-design.cjs
      - name: Verify snapshot and version
        run: |
          node -e "const fs=require('fs'),v=require('./version.json');if(!fs.readFileSync(v.entry).equals(fs.readFileSync(v.snapshot)))process.exit(1)"
      - name: Install browser test tools
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium webkit
      - name: Verify CALLBACK-01 on Chromium and WebKit
        run: node tests/callback-01-browser.cjs
      - name: Verify API 1–7 on real Chromium
        run: node audit-api-browser.cjs
      - name: Verify live mobile jump on WebKit
        run: node audit-api-browser.cjs --webkit-tail

  media_general_fixture:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: forward_fixture_ci
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d forward_fixture_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: Pillow==13.0.0
      - run: python -m unittest discover -s fixtures/media-send -p 'test_general*.py' -v
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash fixtures/media-send/general_race_fixture.sh
