name: CACHE-LIFECYCLE-01 delta policy candidate
on:
  pull_request:
    paths: ['index.html', 'references/cache-lifecycle-01/**', '.github/workflows/cache-delta-candidate.yml']
permissions:
  contents: read
jobs:
  delta-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test references/cache-lifecycle-01/*.test.cjs
  sql-fixture:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: delta_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: psql -h 127.0.0.1 -U postgres -d delta_fixture -f references/cache-lifecycle-01/thread-delta-fixture.sql
        env:
          PGPASSWORD: fixture
