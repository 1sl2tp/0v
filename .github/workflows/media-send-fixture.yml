name: MEDIA-SEND-01 private fixture
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: media_fixture_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d media_fixture_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s fixtures/media-send -p 'test_png.py'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -X -v ON_ERROR_STOP=1 -f fixtures/media-send/test.sql
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: media_fixture_ci
          PGPASSWORD: fixture_only

      - run: bash fixtures/media-send/race.sh
