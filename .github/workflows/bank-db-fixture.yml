name: Bank database fixture
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres-fixture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: bank_fixture_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bank_fixture_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash fixtures/bank-db/test.sh
