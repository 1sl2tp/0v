name: SCROLL-01 S6 single tail writer
on:
  pull_request:
    paths: ['index.html','tests/scroll-01-s6.test.cjs','.github/workflows/scroll-01-s6.yml']
permissions:
  contents: read
jobs:
  tail-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/scroll-01-s6.test.cjs
