<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOBILE-FORWARD-01 · Lab</title>
<style>
:root{font:16px/1.45 system-ui,sans-serif;color-scheme:light dark;--line:color-mix(in srgb,CanvasText 16%,transparent);--soft:color-mix(in srgb,CanvasText 5%,Canvas);--accent:#1769d2}
*{box-sizing:border-box}body{margin:0;background:Canvas;color:CanvasText}main{max-width:560px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:21px;margin:0}h2{font-size:17px;margin:0 0 8px}p{margin:8px 0}.notice{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;background:var(--soft)}form,section{display:grid;gap:12px;margin-top:16px}label{display:grid;gap:5px;font-size:14px}select,input,button{font:inherit;min-height:44px;border:1px solid var(--line);border-radius:10px;background:Canvas;color:CanvasText;padding:9px 12px;min-width:0}select,input{width:100%}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--accent);color:white;border-color:transparent}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}.summary div{padding:10px;text-align:center}.summary div+div{border-left:1px solid var(--line)}.summary strong{display:block;font-size:22px}.summary small{font-size:12px}ol{max-height:200px;overflow:auto;margin:0;padding:8px 8px 8px 32px;border:1px solid var(--line);border-radius:10px;font-size:14px}li{padding:3px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}output{display:block;min-height:46px;overflow-wrap:anywhere;font-size:14px}progress{width:100%;height:12px}[hidden]{display:none!important}
</style></head><body><main>
<header><h1>Chuyển tiếp ảnh</h1><small>LAB</small></header>
<p class="notice">Dữ liệu mẫu · Không đăng nhập, không kết nối Supabase hoặc Zalo. Gửi thật đang khóa cho đến khi MEDIA-SEND-01 được nghiệm thu.</p>
<form id="form">
<label>Hội thoại nguồn<select id="source" required></select></label>
<label>Hội thoại nhận<select id="destination" required></select></label>
<label>Từ ngày, giờ (Việt Nam, UTC+7)<input id="from" type="datetime-local" required value="2026-11-28T08:00"></label>
<label>Đến ngày, giờ (Việt Nam, UTC+7)<input id="to" type="datetime-local" required value="2026-11-28T23:59"></label>
<button id="preview" type="submit" class="primary">Kiểm tra ảnh trùng</button>
</form>
<section id="review" hidden aria-labelledby="reviewTitle"><h2 id="reviewTitle">Xem trước</h2><div class="summary"><div><strong id="total">0</strong><small>Tổng ảnh</small></div><div><strong id="skip">0</strong><small>Bỏ trùng</small></div><div><strong id="count">0</strong><small>Cần gửi</small></div></div><p id="route"></p><ol id="items" aria-label="Thứ tự ảnh sẽ gửi"></ol><progress id="progress" value="0" max="1"></progress><div class="actions"><button id="stop" disabled> Dừng </button><button id="send" class="primary" disabled>Gửi thử (mô phỏng)</button></div><button id="realSend" disabled>Gửi thật · Chưa khả dụng</button></section>
<output id="status" role="status" aria-live="polite"></output>
</main><script type="module" src="./mobile-forward-01-lab.mjs"></script></body></html>
