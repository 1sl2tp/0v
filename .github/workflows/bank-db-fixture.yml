name: Bank database fixture
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres-fixture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: bank_fixture_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bank_fixture_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash fixtures/bank-db/test.sh

  media_general_fixture:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: forward_fixture_ci
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d forward_fixture_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: Pillow==13.0.0
      - run: python -m unittest discover -s fixtures/media-send -p 'test_general*.py' -v
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash fixtures/media-send/general_race_fixture.sh
