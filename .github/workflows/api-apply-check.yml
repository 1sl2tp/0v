name: API application check
on:
  pull_request:
    branches: [main]
  push:
    branches: ['review/**']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/callback-01-policy.test.mjs
      - run: node audit-design.cjs
      - name: Verify snapshot and version
        run: |
          node -e "const fs=require('fs'),v=require('./version.json');if(!fs.readFileSync(v.entry).equals(fs.readFileSync(v.snapshot)))process.exit(1)"
      - name: Install browser test tools
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium webkit
      - name: Verify API 1–7 on real Chromium
        run: node audit-api-browser.cjs
      - name: Verify live mobile jump on WebKit
        run: node audit-api-browser.cjs --webkit-tail
