name: SNAPSHOT-01 durable cache and prior Pages proof
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/snapshot-01-s2.yml', 'tests/snapshot-01-durable-browser.cjs', 'tests/live-cache-read-tail-browser.cjs']
permissions:
  contents: read
jobs:
  cache-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/snapshot-01-durable-browser.cjs
      - run: node tests/live-cache-read-tail-browser.cjs
  public-proof-256:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Compare prior release manifest and bytes
        run: |
          python - <<'PY'
          import urllib.request,json,hashlib,time
          origin='https://1sl2tp.github.io/0v/'
          expected='v13.256'
          blob='febf65496b5e65afbd78886acfb0a24e854f909b'
          def read(path):
              req=urllib.request.Request(origin+path+'?_proof='+str(time.time_ns()),headers={'Cache-Control':'no-cache','User-Agent':'0v-public-proof'})
              with urllib.request.urlopen(req,timeout=15) as r:
                  if r.status!=200: raise RuntimeError('Unexpected HTTP status')
                  return r.read()
          def git_blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          manifest=json.loads(read('version.json'))
          index=read('index.html')
          snapshot=read('release-v13.256.html')
          bill=read('bill.html')
          print(json.dumps({'expected':expected,'publicVersion':manifest.get('version'),'publicManifestBlob':manifest.get('gitBlobSha'),'indexBlob':git_blob(index),'snapshotBlob':git_blob(snapshot),'billBlob':git_blob(bill)}))
          assert manifest.get('version')==expected and manifest.get('gitBlobSha')==blob and git_blob(index)==blob and git_blob(snapshot)==blob and git_blob(bill)==blob
          PY
