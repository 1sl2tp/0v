/* ChatReadAPI — host-authorized read projection. No credentials, network, persistence or write methods. */
const ChatReadAPI=(()=>{
 const id=x=>typeof x==='string'&&x.length>0&&x.length<=200&&x.trim()===x;
 const stamp=x=>typeof x==='string'&&/T.*(?:Z|[+-]\d\d:\d\d)$/.test(x)&&Number.isFinite(Date.parse(x));
 const str=(x,n)=>typeof x==='string'?x.slice(0,n):'';

  if([session,readContacts,readThread].some(x=>typeof x!=='function'))throw Error('Invalid read host');
  let bound=null,contacts=new Map(),disposed=false,request=0;
  function clear(){contacts.clear();bound=null;request++}
  function scope(){
   const s=session();if(disposed||s?.approved!==true||!id(s.accountId)||!id(s.epoch)){clear();throw Error('Read session unavailable')}
   if(bound&&(bound.accountId!==s.accountId||bound.epoch!==s.epoch)){clear();throw Error('Read session changed')}
   bound=Object.freeze({accountId:s.accountId,epoch:s.epoch});return bound;
  }
  function current(s,seq){const now=scope();if(now.accountId!==s.accountId||now.epoch!==s.epoch||seq!==request)throw Error('Stale read response')}
  async function directory(){
   const s=scope(),seq=++request;
   const rows=await readContacts(s);current(s,seq);
   if(!Array.isArray(rows)||rows.length>5000)throw Error('Invalid directory response');
   const next=new Map();
   for(const row of rows){
    if(!row||row.deleted_at||row.locked_at)continue;
    if(!id(row.id)||next.has(row.id)||typeof row.display_name!=='string')throw Error('Invalid contact');
    const value=Object.freeze({id:row.id,name:str(row.display_name,300),role:str(row.role,40),conversationId:id(row.conversation_id)?row.conversation_id:null,preview:str(row.preview_text,500),time:time(row.latest_at),unread:row.has_unread===true});
    next.set(value.id,value);
   }
   contacts=next;return Object.freeze([...next.values()]);
  }
  async function thread(contactId){
   const s=scope(),contact=contacts.get(contactId);if(!contact)throw Error('Contact not in authorized directory');
   const seq=++request;if(!contact.conversationId)return Object.freeze([]);
   const rows=await readThread(s,contact.conversationId);current(s,seq);
   if(!Array.isArray(rows)||rows.length>100)throw Error('Invalid thread response');
   const seen=new Set(),out=[];
   for(const row of rows){
    if(!row||row.deleted_at)continue;
    if(!id(row.id)||seen.has(row.id)||row.conversation_id!==contact.conversationId||!id(row.sender_account_id)||!stamp(row.created_at))throw Error('Invalid message scope');
    seen.add(row.id);
    out.push(Object.freeze({id:row.id,text:str(row.body,20000),mine:row.sender_account_id===s.accountId,date:Date.parse(row.created_at),time:time(row.created_at)}));
   }
   return Object.freeze(out.sort((a,b)=>a.date-b.date||a.id.localeCompare(b.id)));
  }
  function dispose(){disposed=true;clear()}
  return Object.freeze({directory,thread,dispose});
 }
 return Object.freeze({create});
})();

const MainDataController=(()=>{

   const p=room(id),prior=conversations.get(id),sequence=(messages.latest(id)?.sequence||0)+1,seed=typeof value==='string',text=seed?value:value?.text,mine=seed?sequence%2===0:value?.mine;
   if(typeof text!=='string'||typeof mine!=='boolean'||(!seed&&(!Number.isFinite(value.date)||!Number.isFinite(new Date(value.date).getTime())||typeof value.time!=='string'||(value.originalText!==undefined&&typeof value.originalText!=='string'))))throw Error('Invalid fixture message');
   if(!seed&&value.media!==undefined&&(!Array.isArray(value.media)||value.media.length>8||value.media.some(m=>typeof m?.src!=='string'||!m.src.startsWith('blob:')||!Number.isSafeInteger(m.width)||!Number.isSafeInteger(m.height)||m.width<1||m.height<1||typeof m.alt!=='string')))throw Error('Invalid local media');

  function readStatus(id){room(id);return reads.get(id).status()}

const BillEvidenceAPI=(()=>{

  const effective=reread||original||{},reasons=[];let sameAmount=false;

  else{
   if(!ParseAPI.sameAccount(bank.account,configured))reasons.push('bank-account');

review.push(raw.trim())}
return {rows,review};
}
