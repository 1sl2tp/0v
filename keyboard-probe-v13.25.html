<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>0v — Probe bàn phím v13.25</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:16px/1.5 system-ui;background:#f8f8f8}#shell{position:fixed;top:var(--top,0px);left:var(--left,0px);width:var(--width,100%);height:var(--height,100dvh);display:grid;grid-template-rows:auto minmax(0,1fr) auto;border:1px solid #aaa}header{padding:12px 16px;border-bottom:1px solid #ddd}main{overflow:auto;padding:16px}pre{font:13px/1.5 monospace;white-space:pre-wrap;overflow-wrap:anywhere}footer{padding:8px 16px;display:flex;gap:8px;background:white}textarea{font:17px/22px system-ui;flex:1;min-width:0;resize:none;height:44px;padding:10px;border:1px solid #aaa;border-radius:12px}button{font:inherit;min-height:44px;border:1px solid #aaa;border-radius:12px;background:white}
</style></head><body><div id="shell"><header><strong>Probe v13.25 — chỉ khung và input</strong></header><main><p>Chạm ô nhập, đợi bàn phím mở, sau đó chạm vùng này để đóng hoặc dùng nút Done. Đợi số đo hiện. Không có thư viện chat, kính, cuộn tự động hay đo chữ.</p><pre id="out">Chưa đo.</pre><button id="copy">Sao chép số đo</button></main><footer><textarea id="draft" rows="1" placeholder="Nhập thử"></textarea></footer></div><script>
const shell=document.querySelector('#shell'),draft=document.querySelector('#draft'),out=document.querySelector('#out'),copy=document.querySelector('#copy');let raf=0,until=0,started=0,phase='',last=null,rows=[],events=0,maxRaw=0,maxGap=0,report='',applied={};
function rect(){const v=window.visualViewport;return{top:v?.offsetTop??0,left:v?.offsetLeft??0,width:v?.width??innerWidth,height:v?.height??innerHeight}}
function apply(r){for(const [k,v] of Object.entries(r))if(applied[k]!==v)document.documentElement.style.setProperty('--'+k,v+'px');applied=r}
function step(t){raf=0;const r=rect(),raw=r.top+r.height;apply(r);const actual=shell.getBoundingClientRect().bottom,foot=draft.getBoundingClientRect().bottom,row={t:Math.round(t-started),raw,actual,input:foot};if(last){maxRaw=Math.max(maxRaw,Math.abs(raw-last.raw));maxGap=Math.max(maxGap,Math.abs(raw-actual))}if(!last||last.raw!==raw||last.actual!==actual||last.input!==foot)rows.push(row);last=row;if(t<until)raf=requestAnimationFrame(step);else{report=[phase+' | '+(matchMedia('(display-mode:standalone)').matches?'PWA':'Web'),'Viewport events: '+events,'Raw bước max: '+maxRaw.toFixed(1)+' px','Sai bám max: '+maxGap.toFixed(1)+' px','Số lần đổi tọa độ: '+rows.length].join('\n');out.textContent=report}}
function begin(name){if(raf)cancelAnimationFrame(raf);started=performance.now();until=started+1200;phase=name;last=null;rows=[];events=maxRaw=maxGap=0;out.textContent='Đang đo '+name;step(started)}
function signal(){if(!raf){begin('viewport')}events++;until=Math.max(until,performance.now()+400)}
draft.addEventListener('focus',()=>begin('mở'));draft.addEventListener('blur',()=>begin('đóng'));window.visualViewport?.addEventListener('resize',signal);window.visualViewport?.addEventListener('scroll',signal);window.addEventListener('resize',signal);document.querySelector('main').addEventListener('click',e=>{if(e.target!==copy)draft.blur()});copy.onclick=async()=>{try{await navigator.clipboard.writeText(report+'\n'+JSON.stringify(rows));copy.textContent='Đã sao chép'}catch{copy.textContent='Không sao chép được'}};apply(rect());
</script></body></html>
