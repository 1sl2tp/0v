name: Bill audit synthetic fixture
on:
  pull_request:
    paths:
      - 'tools/bill-audit-batch*'
      - '.github/workflows/bill-audit-fixture.yml'
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/bill-audit-batch.test.mjs
