<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0v — Kiểm tra phát hành</title><style>
*{box-sizing:border-box}body{font:15px/1.5 system-ui,sans-serif;max-width:720px;margin:0 auto;padding:24px 16px;color:#171717;background:#fff}h1{font-size:22px;margin:0 0 8px}p{margin:8px 0 16px}button,a{font:inherit}button{min-height:44px;border:1px solid #ccc;border-radius:12px;background:#fff;padding:8px 16px}table{border-collapse:collapse;width:100%;margin-top:16px;table-layout:fixed}th,td{text-align:left;vertical-align:top;padding:12px 6px;border-bottom:1px solid #ddd;overflow-wrap:anywhere}th:first-child{width:30%}small{color:#666}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 monospace;background:#f5f5f5;border-radius:8px;padding:12px}a{color:inherit}
</style></head><body><h1>Kiểm tra phát hành CHAT CRM</h1><p>Kiểm tra đường truyền và phiên bản, không sửa dữ liệu ứng dụng. Bản mong đợi của vòng này: <strong>v13.31</strong>.</p><button id="run">Kiểm tra lại</button> <button id="copy">Sao chép kết quả</button><p id="status" role="status"></p><table><thead><tr><th>Đường dẫn</th><th>Kết quả thực tế</th></tr></thead><tbody id="rows"></tbody></table><pre id="log"></pre><p><a href="./release-v13.31.html">Mở v13.31</a> · <a href="./keyboard-probe-v13.25.html">Đo bàn phím</a></p><script>
const EXPECTED='v13.31',SHA='5126d11d802149c68be6e21721af2cb0fb849963';
const run=document.querySelector('#run'),copy=document.querySelector('#copy'),rows=document.querySelector('#rows'),status=document.querySelector('#status'),log=document.querySelector('#log');
let report='';
function classify({ok,http,version,sha,unicorn}){if(!ok||unicorn)return 'Lỗi HTTP / máy chủ '+http;if(!version)return 'Không phải trang CHAT CRM';if(version!==EXPECTED)return 'Bản khác: '+version;if(!sha)return 'Đúng version, chưa xác minh mã nguồn';return sha===SHA?'Đúng bản nguồn':'Version đúng nhưng nội dung khác'}
async function gitBlobSha(bytes){if(!crypto.subtle)return null;const prefix=new TextEncoder().encode('blob '+bytes.byteLength+'\0'),data=new Uint8Array(prefix.length+bytes.byteLength);data.set(prefix);data.set(new Uint8Array(bytes),prefix.length);return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-1',data)),b=>b.toString(16).padStart(2,'0')).join('')}
async function fetchPath(path){const url=new URL(path,location.href);url.searchParams.set('_check',String(Date.now()));const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(url,{cache:'no-store',signal:controller.signal});const bytes=await response.arrayBuffer();const body=new TextDecoder().decode(bytes);return {path,ok:response.ok,http:response.status,body,bytes,cache:response.headers.get('age'),date:response.headers.get('date'),type:response.headers.get('content-type')}}catch(e){return{path,ok:false,http:'—',error:e.message}}finally{clearTimeout(timer)}}
function titleVersion(body){return body?.match(/<title>[^<]*\b(v\d+\.\d+)<\/title>/i)?.[1]||null}
function append(path,result){const tr=document.createElement('tr'),a=document.createElement('td'),b=document.createElement('td');a.textContent=path;b.textContent=result;tr.append(a,b);rows.append(tr)}
async function check(){run.disabled=true;rows.replaceChildren();status.textContent='Đang kiểm tra…';const results=[];try{
 const files=await Promise.all(['./','./index.html','./release-v13.31.html','./version.json','./keyboard-probe-v13.25.html'].map(fetchPath));
 for(const f of files){let verdict,sha=null,version=null;if(f.path.endsWith('.json')){try{const m=JSON.parse(f.body);verdict=f.ok&&m.version===EXPECTED&&m.gitBlobSha===SHA?'Manifest đúng':'Manifest khác hoặc lỗi'}catch{verdict='Không đọc được manifest'}}else if(f.path.includes('probe')){verdict=f.ok&&f.body?.includes('Probe v13.25')?'Probe truy cập được':'Probe chưa xác nhận'}else{version=titleVersion(f.body);if(f.ok&&f.bytes)try{sha=await gitBlobSha(f.bytes)}catch{}verdict=classify({ok:f.ok,http:f.http,version,sha,unicorn:/unicorn|really bad day/i.test(f.body||'')&&!version})}
 append(f.path,verdict+' · HTTP '+f.http);results.push({path:f.path,verdict,http:f.http,version,sha,age:f.cache,date:f.date,error:f.error})}
 const passed=results.slice(0,3).every(r=>r.verdict==='Đúng bản nguồn')&&results[3].verdict==='Manifest đúng'&&results[4].verdict==='Probe truy cập được';status.textContent=passed?'Đã xác nhận các đường dẫn phục vụ đúng v13.31.':'Chưa xác nhận phát hành đầy đủ. Xem từng kết quả bên dưới.';report=JSON.stringify({checkedAt:new Date().toISOString(),expected:EXPECTED,passed,results},null,2);log.textContent=report
 }catch(e){status.textContent='Lỗi kiểm tra: '+e.message}finally{run.disabled=false}}
run.onclick=check;copy.onclick=async()=>{try{await navigator.clipboard.writeText(report);copy.textContent='Đã sao chép'}catch{copy.textContent='Không sao chép được'}};check();
</script></body></html>
