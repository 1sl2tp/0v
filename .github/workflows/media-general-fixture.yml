name: MEDIA-SEND general isolated fixture
on:
  pull_request:
    paths:
      - 'fixtures/media-send/**'
      - '.github/workflows/media-general-fixture.yml'
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: forward_fixture_ci
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d forward_fixture_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: Pillow==13.0.0
      - run: python -m unittest discover -s fixtures/media-send -p 'test_general*.py' -v
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash fixtures/media-send/general_race_fixture.sh
