name: Focused bill evidence cache
on:
  pull_request:
    branches: [main]
    paths: ['tests/focused-bill-evidence-cache-browser.cjs','.github/workflows/focused-bill-evidence-cache.yml','index.html']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/focused-bill-evidence-cache-browser.cjs
